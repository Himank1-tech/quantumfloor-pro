[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-trading-floor"
version = "1.0.0"
description = "Production-Grade Multi-Agent Autonomous Trading Floor for Indian Equities (NSE/BSE) and Global Forex"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Autonomous Trading Floor Engineering Team"}
]
keywords = [
    "trading",
    "multi-agent",
    "mcp",
    "quantitative-finance",
    "risk-governor",
    "nse",
    "bse",
    "forex",
    "fastapi",
    "sharpe-ratio",
    "kelly-criterion"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "starlette>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
trading-floor = "trading_platform.backend.api:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_platform*"]
