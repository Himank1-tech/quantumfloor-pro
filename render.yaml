# ==============================================================================
# QuantumFloor Pro - Render Infrastructure as Code Blueprint
# Dockerized multi-agent institutional trading platform
# ==============================================================================

services:
  - type: web
    name: quantumfloor-pro
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: SIMULATION_MODE
        value: "true"
      - key: DEFAULT_INR_CAPITAL
        value: "1000000.0"
      - key: DEFAULT_USD_CAPITAL
        value: "25000.0"
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: "https://quantumfloor-pro.onrender.com"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL
        value: "https://br-proud-breeze-azco8vlo.storage.c-3.ap-southeast-1.aws.neon.tech"
      - key: AWS_ENDPOINT_URL_S3
        value: "https://br-proud-breeze-azco8vlo.storage.c-3.ap-southeast-1.aws.neon.tech"
      - key: AWS_REGION
        value: "ap-southeast-1"
      - key: NEON_STORAGE_BUCKET
        value: "quantumfloor-reports"
      - key: NEON_REALTIME_URL
        value: "wss://ep-snowy-art-az4tj0ze.rt.c-3.ap-southeast-1.aws.neon.tech/"
      - key: NEON_REALTIME_SECRET
        sync: false
